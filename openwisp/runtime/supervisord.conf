[unix_http_server]
file=/run/ha-openwisp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/ha-openwisp/supervisor.sock

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/ha-openwisp/supervisord.pid
childlogdir=/run/ha-openwisp

[eventlistener:required-processes]
command=python -u /opt/ha-openwisp/events.py
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
priority=1
autostart=true
autorestart=unexpected
startsecs=0
buffer_size=32
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
command=/usr/bin/redis-server /run/ha-openwisp/redis.conf
user=redis
priority=10
autostart=true
autorestart=false
startsecs=1
startretries=0
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:websocket]
command=python -u /opt/ha-openwisp/service.py
user=openwisp
directory=/opt/openwisp
priority=30
autostart=false
autorestart=false
startsecs=1
startretries=0
stopsignal=INT
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:postgres]
command=python -u /opt/ha-openwisp/postgres.py
user=postgres
priority=10
autostart=true
autorestart=false
startsecs=1
startretries=0
stopsignal=INT
stopwaitsecs=30
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:influxdb]
command=/usr/local/bin/influxd -config /run/ha-openwisp/influxdb.conf
user=influxdb
priority=10
autostart=true
autorestart=false
startsecs=1
startretries=0
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:initialize]
command=python -u /opt/ha-openwisp/initialize.py
user=openwisp
directory=/opt/ha-openwisp/dashboard
environment=MODULE_NAME="dashboard",PYTHONPATH="/opt/ha-openwisp/dashboard"
priority=20
autostart=true
autorestart=false
startsecs=0
startretries=0
exitcodes=0
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dashboard]
command=uwsgi --ini /opt/ha-openwisp/uwsgi.ini --socket 127.0.0.1:8000
user=openwisp
directory=/opt/ha-openwisp/dashboard
environment=MODULE_NAME="dashboard",PYTHONPATH="/opt/ha-openwisp/dashboard"
umask=0027
priority=30
autostart=false
autorestart=false
startsecs=1
startretries=0
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=uwsgi --ini /opt/ha-openwisp/uwsgi.ini --socket 127.0.0.1:8001
user=openwisp
directory=/opt/ha-openwisp/api
environment=MODULE_NAME="api",PYTHONPATH="/opt/ha-openwisp/api"
umask=0027
priority=30
autostart=false
autorestart=false
startsecs=1
startretries=0
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery]
command=celery -A openwisp worker --loglevel=WARNING --concurrency=%(ENV_HA_OPENWISP_CELERY_CONCURRENCY)s --queues=celery,network,monitoring,monitoring_checks --hostname=celery@%%h
user=openwisp
directory=/opt/ha-openwisp/dashboard
environment=MODULE_NAME="celery",PYTHONPATH="/opt/ha-openwisp/dashboard"
umask=0027
priority=30
autostart=false
autorestart=false
startsecs=1
startretries=0
stopsignal=TERM
stopwaitsecs=30
stopasgroup=false
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=celery -A openwisp beat --loglevel=WARNING --schedule=/data/openwisp/celery/beat
user=openwisp
directory=/opt/ha-openwisp/dashboard
environment=MODULE_NAME="celerybeat",PYTHONPATH="/opt/ha-openwisp/dashboard"
umask=0027
priority=30
autostart=false
autorestart=false
startsecs=1
startretries=0
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -c /run/ha-openwisp/nginx.conf -g "daemon off;"
user=root
directory=/opt/ha-openwisp/dashboard
environment=MODULE_NAME="nginx",PYTHONPATH="/opt/ha-openwisp/dashboard"
umask=0027
priority=40
autostart=false
autorestart=false
startsecs=1
startretries=0
stopsignal=QUIT
stopwaitsecs=30
stopasgroup=false
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ingress]
command=python -u /opt/ha-openwisp/service.py --ingress
user=openwisp
directory=/opt/ha-openwisp/dashboard
environment=MODULE_NAME="dashboard",PYTHONPATH="/opt/ha-openwisp/dashboard:/opt/ha-openwisp"
umask=0027
priority=30
autostart=false
autorestart=false
startsecs=1
startretries=0
stopsignal=INT
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
