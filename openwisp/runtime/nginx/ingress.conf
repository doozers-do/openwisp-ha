# Internal only: never publish 8099 in Supervisor ports. No subnet-wide trust.
server {
    listen 8099;
    server_name _;
    allow 172.30.32.2;
    deny all;
    client_max_body_size 30M;
    add_header Content-Security-Policy "default-src 'self' data: blob: http: https: 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self'; connect-src 'self'; worker-src 'self' blob:;" always;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Openwisp-Peer $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_redirect off;
    }
}
