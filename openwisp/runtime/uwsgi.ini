; Shared settings for the pinned dashboard and API applications.
[uwsgi]
module = openwisp.wsgi:application
master = true
processes = 1
threads = 1
enable-threads = true
single-interpreter = true
; Load Django after forking so the Python runtime does not retain master locks.
lazy-apps = true
need-app = true
die-on-term = true
reload-mercy = 10
worker-reload-mercy = 10
harakiri = 20
max-requests = 5000
vacuum = true
; Request URLs can include agent keys; keep them out of app logs.
disable-logging = true
buffer-size = 8192
